[package]
name = "ili9431_esp32s3_test"
version = "0.1.0"
authors = ["bjoernQ <bjoern.quentin@mobile-j.de>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
esp-hal = { package = "esp-hal", version = "0.23.1", features = [
    "esp32s3",
    "log",
    "unstable",
] }
esp-backtrace = { version = "0.15.0", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-println = { version = "0.13.0", features = ["esp32s3", "log"] }
mipidsi = "0.8.0"
embedded-hal = "1.0.0"
embedded-graphics = "0.8.1"
display-interface = "0.5.0"
byte-slice-cast = { version = "1.2.2", default-features = false }
embedded-dma = "0.2.0"
critical-section = "1.1.2"
num-traits = { version = "0.2.19", default-features = false }
fugit = "0.3.7"
static_cell = { version = "2.1.0", features = ["nightly"] }
xtensa-lx-rt = { version = "0.18.0" }
xtensa-lx = { version = "0.10.0" }
[features]
fps = []

[patch.crates-io]
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git" }
xtensa-lx-rt = { git = "https://github.com/esp-rs/esp-hal.git" }
xtensa-lx = { git = "https://github.com/esp-rs/esp-hal.git" }
